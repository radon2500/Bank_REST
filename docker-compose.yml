services:
  postgres:
    image: postgres:16
    container_name: bank-rest-postgres
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - bank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bank_user -d bank_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-rest-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bank_db
      DB_USER: bank_user
      DB_PASSWORD: bank_password
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CARD_CRYPTO_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SEED_ADMIN_PASSWORD: admin123
      SEED_USER_PASSWORD: user123
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  bank-db-data:
