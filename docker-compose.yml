version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: bank-rest-postgres
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - bank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bank_user -d bank_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bank-db-data:
