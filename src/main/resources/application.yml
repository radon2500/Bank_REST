server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_db}
    username: ${DB_USER:bank_user}
    password: ${DB_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/migration/db.changelog-master.yaml

jwt:
  secret: ${JWT_SECRET:VGhpc0lzQVNlY3VyZVBsYWNlaG9sZGVyU2VjcmV0S2V5Rm9ySldUMTIzNDU2Nzg5}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-password: ${SEED_ADMIN_PASSWORD:admin123}
    user-username: ${SEED_USER_USERNAME:user}
    user-password: ${SEED_USER_PASSWORD:user123}
  crypto:
    secret: ${CARD_CRYPTO_SECRET:VGhpc0lzQUNhcmROdW1iZXJFbmNyeXB0aW9uS2V5MTIzNDU2}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
